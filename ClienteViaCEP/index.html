<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Consulta CEP</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
</head>

<body>

    <h1>Consulta de CEP</h1>

    <p>
        CEP:
        <input type="text" id="cep" maxlength="9">
        <button id="consultar">Consultar</button>
    </p>

    <p>
        Logradouro:
        <input type="text" id="logradouro" size="50" readonly>
    </p>

    <p>
        Localidade:
        <input type="text" id="localidade" size="50" readonly>
    </p>

    <p>
        UF:
        <input type="text" id="uf" size="2" readonly>
    </p>

    <p id="mensagem"></p>


    <script>

        $(document).ready(function() {

            $("#cep").on("input", function() {

                var cep = $(this).val();

                cep = cep.replace(/\D/g, "");

                if (cep.length > 5) {
                    cep = cep.substring(0, 5) + "-" + cep.substring(5, 8);
                }

                $(this).val(cep);

            });

            $("#consultar").click(function() {

                var cep = $("#cep").val();

                cep = cep.replace("-", "");

                if (cep.length != 8) {

                    $("#mensagem").text("CEP inválido.");
                    return;
                }


                $.ajax({

                    url: "https://viacep.com.br/ws/" + cep + "/json/",

                    type: "GET",

                    dataType: "json",

                    success: function(dados) {

                        if (dados.erro) {

                            $("#mensagem").text("CEP não encontrado.");

                            $("#logradouro").val("");
                            $("#localidade").val("");
                            $("#uf").val("");

                        } else {

                            $("#logradouro").val(dados.logradouro);
                            $("#localidade").val(dados.localidade);
                            $("#uf").val(dados.uf);

                            $("#mensagem").text("");
                        }
                    },

                    error: function() {

                        $("#mensagem").text("Erro ao consultar o CEP.");
                    }

                });

            });

        });

    </script>

</body>
</html>
